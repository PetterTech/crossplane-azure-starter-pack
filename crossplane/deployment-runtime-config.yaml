# Runs every Azure provider with Workload Identity under one service account.
# The federated credential subject is system:serviceaccount:crossplane-system:provider-azure.
# Client, tenant and subscription IDs live in the ClusterProviderConfig, not here.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azure
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
  serviceAccountTemplate:
    metadata:
      name: provider-azure
