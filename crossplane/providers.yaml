# Azure providers. Keep all of them on the same version.
# Each provider ships all of its supported resource types, not just those used here.
# Activating them all can increase cluster and provider resource usage. To limit this,
# replace the default activate-all ManagedResourceActivationPolicy (MRAP) with one
# that activates only the resource types your platform needs.
# https://docs.crossplane.io/latest/managed-resources/managed-resource-activation-policies/
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-azure
spec:
  package: xpkg.upbound.io/upbound/provider-family-azure:v2.8.0
  runtimeConfigRef:
    name: provider-azure
