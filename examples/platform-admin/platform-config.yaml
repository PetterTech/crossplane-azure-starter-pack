apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: platform-defaults

data:
  azure:
    tenantId: <tenant-id>
    defaultRegion: <default-location>
    managementGroups:
      landingZones: <management-group-id>
      corp: <corp-management-group-id>
      online: <online-management-group-id>
    billingScope: <billing-scope>
    identity:
      subscriptionId: <central-identity-subscription-id>
      resourceGroupName: <central-identity-resource-group-name>
      location: <central-identity-location>
    namingPrefix: <naming-prefix>
  networking:
    swedencentral:
      hubId: <vwan-hub-id>
      azureFirewallIp: <azure-firewall-ip>
      ipam:
        ipAddressPool: <ip-address-pool-id>
  tags:
    managed-by: crossplane
    platform: starter-pack
# Example only: replace placeholder values with your platform bootstrap inputs.
