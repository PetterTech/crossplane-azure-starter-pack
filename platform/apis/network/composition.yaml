apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: network
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
    - step: derive-azure-network
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- /* Read the referenced LandingZone so Network does not duplicate profile input. */ -}}
            {{- $extraResources := default (dict) .extraResources -}}
            {{- $landingZoneLookup := default (dict "items" (list)) (index $extraResources "landingzone") -}}
            {{- $landingZoneItems := default (list) $landingZoneLookup.items -}}
            {{- $landingZone := dict -}}
            {{- if gt (len $landingZoneItems) 0 -}}
            {{- $landingZone = index $landingZoneItems 0 -}}
            {{- end -}}
            {{- /* Prefer derived status.networkProfile; fallback to LandingZone spec.type in early reconcile. */ -}}
            {{- $networkProfile := "TODO-derive-from-landing-zone" -}}
            {{- if and (hasKey $landingZone "status") $landingZone.status.networkProfile -}}
            {{- $networkProfile = $landingZone.status.networkProfile -}}
            {{- else if and (hasKey $landingZone "spec") $landingZone.spec.type -}}
            {{- $networkProfile = $landingZone.spec.type -}}
            {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              landingzone:
                apiVersion: platform.example.org/v1alpha1
                kind: LandingZone
                matchName: {{ $xr.spec.landingZoneRef.name }}
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: XNetwork
            status:
              # TODO: Keep this explicit until the in-cluster ExtraResources lookup is validated.
              networkProfile: {{ $networkProfile }}
            ---
            apiVersion: azure.platform.example.org/v1alpha1
            kind: XAzureVirtualNetwork
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "azure-virtual-network" }}
            spec:
              landingZoneRef:
                name: {{ $xr.spec.landingZoneRef.name }}
              # ProviderConfig name intentionally matches the LandingZone name.
              providerConfigName: {{ $xr.spec.landingZoneRef.name }}
              size: {{ $xr.spec.size }}
              networkProfile: {{ $networkProfile }}
              # Internal compositions own corp vs online implementation details.
              compositionSelector:
                matchLabels:
                  platform.example.org/network-profile: {{ $networkProfile }}
