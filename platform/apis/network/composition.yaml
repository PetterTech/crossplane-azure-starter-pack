apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: network
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
    # Network is a cloud-agnostic public product.
    # In this starter pack branch, the implementation target is Azure, so this
    # composition emits XAzureVirtualNetwork.
    # A future multi-cloud branch could emit another internal XR instead
    # (for example XAwsVpc) while keeping the same public Network claim shape.
    - step: derive-azure-network
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- /* Read LandingZone via ExtraResources so Network stays minimal for developers. */ -}}
            {{- /* Developers only set landingZoneRef.name and size; profile/provider stay internal. */ -}}
            {{- $extraResources := default (dict) .extraResources -}}
            {{- $landingZoneLookup := default (dict "items" (list)) (index $extraResources "landingzone") -}}
            {{- $landingZoneItems := default (list) $landingZoneLookup.items -}}
            {{- $landingZone := dict -}}
            {{- if gt (len $landingZoneItems) 0 -}}
            {{- $landingZone = index $landingZoneItems 0 -}}
            {{- end -}}
            {{- /* Prefer derived LandingZone status.networkProfile; fallback to LandingZone spec.type early on. */ -}}
            {{- $networkProfile := "TODO-derive-from-landing-zone" -}}
            {{- if and (hasKey $landingZone "status") $landingZone.status.networkProfile -}}
            {{- $networkProfile = $landingZone.status.networkProfile -}}
            {{- else if and (hasKey $landingZone "spec") $landingZone.spec.type -}}
            {{- $networkProfile = $landingZone.spec.type -}}
            {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              landingzone:
                apiVersion: platform.example.org/v1alpha1
                kind: LandingZone
                matchName: {{ $xr.spec.landingZoneRef.name }}
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: XNetwork
            status:
              # Educational starter-pack status surface showing resolved profile.
              networkProfile: {{ $networkProfile }}
            ---
            apiVersion: azure.platform.example.org/v1alpha1
            kind: XAzureVirtualNetwork
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "azure-virtual-network" }}
            spec:
              landingZoneRef:
                name: {{ $xr.spec.landingZoneRef.name }}
              # ProviderConfig name intentionally matches the LandingZone name.
              providerConfigName: {{ $xr.spec.landingZoneRef.name }}
              size: {{ $xr.spec.size }}
              networkProfile: {{ $networkProfile }}
              # Internal Azure compositions own corp vs online implementation details.
              compositionSelector:
                matchLabels:
                  platform.example.org/network-profile: {{ $networkProfile }}
