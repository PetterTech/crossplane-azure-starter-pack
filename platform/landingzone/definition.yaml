apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: landingzones.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: LandingZone
    plural: landingzones
  defaultCompositionRef:
    name: landingzones.azure.platform.example.org
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  name:
                    type: string
                    description: Base name for the landing zone. Used to derive the subscription, resource group, vnet, storage account and key vault names.
                    minLength: 3
                    maxLength: 18
                    pattern: '^[a-z0-9]+$'
                  tags:
                    type: object
                    description: Arbitrary tags to apply to every resource in the landing zone.
                    additionalProperties:
                      type: string
                required:
                - name
            required:
            - parameters
          status:
            type: object
            properties:
              subscriptionId:
                type: string
              providerConfigName:
                type: string
              resourceGroupName:
                type: string
              vnetName:
                type: string
              subnetId:
                type: string
              storageAccountName:
                type: string
              keyVaultName:
                type: string
    additionalPrinterColumns:
    - name: Name
      type: string
      jsonPath: .spec.parameters.name
    - name: SubscriptionId
      type: string
      jsonPath: .status.subscriptionId
---
