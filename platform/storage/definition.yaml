apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: storageaccounts.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: StorageAccount
    plural: storageaccounts
  defaultCompositionRef:
    name: storageaccounts.azure.storage.platform.example.org
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  name:
                    type: string
                    description: Storage name.
                    minLength: 3
                    maxLength: 24
                    pattern: '^[a-z0-9]+$'
                  geoRedundant:
                    type: boolean
                    description: Whether the backing implementation should use geo-redundant replication.
                  networking:
                    type: string
                    description: Whether the storage account uses a private endpoint or public access.
                    enum:
                    - private
                    - public
                    default: private
                  resourceGroupName:
                    type: string
                    description: The resource group to create the storage account in.
                    default: rg-javazone
                  providerConfigName:
                    type: string
                    description: The ProviderConfig to use, for targeting a specific subscription.
                    default: default
                  subnetId:
                    type: string
                    description: The subnet to attach the private endpoint to, when networking is private.
                    default: /subscriptions/5befef06-0b5f-4acc-909c-65d1950dd6b3/resourceGroups/rg-javazone/providers/Microsoft.Network/virtualNetworks/vnet-javazone/subnets/default
                  tags:
                    type: object
                    description: Arbitrary tags to apply to the backing storage account.
                    additionalProperties:
                      type: string
                required:
                - name
                - geoRedundant
            required:
            - parameters
          status:
            type: object
            properties:
              accountName:
                type: string
              resourceId:
                type: string
              endpoints:
                type: object
                properties:
                  blob:
                    type: string
                  file:
                    type: string
    additionalPrinterColumns:
    - name: Name
      type: string
      jsonPath: .spec.parameters.name
    - name: Geo
      type: boolean
      jsonPath: .spec.parameters.geoRedundant
---
