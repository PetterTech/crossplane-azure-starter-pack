apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: virtualnetworks.platform.a5n.io
spec:
  scope: Namespaced
  group: platform.a5n.io
  names:
    kind: VirtualNetwork
    plural: virtualnetworks
    singular: virtualnetwork
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: SUBSCRIPTION
          type: string
          jsonPath: .status.subscription
        - name: LOCATION
          type: string
          jsonPath: .status.environment.location
        - name: ADDRESS-SPACE
          type: string
          jsonPath: .status.addressSpace
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            An Azure virtual network with an address space allocated from the platform IPAM pool,
            an optional subnet, a network security group that denies inbound traffic by default, and
            an optional connection to the platform's virtual hub. The IPAM pool, the hub, the default
            region and the default resource group come from the platform EnvironmentConfig, never from
            this spec. Condition Ready=True means the virtual network and the requested optional
            parts exist.
          properties:
            spec:
              type: object
              description: Desired virtual network. Every field is optional.
              x-kubernetes-validations:
                - rule: "!has(oldSelf.subscription) || (has(self.subscription) && self.subscription == oldSelf.subscription)"
                  message: "spec.subscription can't be changed once set. Create a new VirtualNetwork instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.location) || (has(self.parameters) && has(self.parameters.location) && self.parameters.location == oldSelf.parameters.location)"
                  message: "spec.parameters.location can't be changed once set. Create a new VirtualNetwork instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.resourceGroupName) || (has(self.parameters) && has(self.parameters.resourceGroupName) && self.parameters.resourceGroupName == oldSelf.parameters.resourceGroupName)"
                  message: "spec.parameters.resourceGroupName can't be changed once set. Create a new VirtualNetwork instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.name) || (has(self.parameters) && has(self.parameters.name) && self.parameters.name == oldSelf.parameters.name)"
                  message: "spec.parameters.name can't be changed once set. Create a new VirtualNetwork instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.size) || (has(self.parameters) && has(self.parameters.size) && self.parameters.size == oldSelf.parameters.size)"
                  message: "spec.parameters.size can't be changed once set. Create a new VirtualNetwork instead."
              properties:
                subscription:
                  type: string
                  description: >-
                    Name of a Subscription in this namespace that the resources are created in. Optional.
                    If omitted, the platform uses the namespace's only Ready Subscription. If the namespace
                    has none or more than one, no resources are created and the SubscriptionResolved condition
                    explains why. Set this field to choose explicitly. The resolved name is recorded in
                    status.subscription and never changes afterwards. It can't be changed once set; to move,
                    create a new resource.
                  maxLength: 63
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                parameters:
                  type: object
                  description: Settings of the virtual network.
                  x-kubernetes-validations:
                    - rule: "!has(self.networkSecurityGroup) || !has(self.networkSecurityGroup.allowInbound) || size(self.networkSecurityGroup.allowInbound) == 0 || !has(self.networkSecurityGroup.enabled) || self.networkSecurityGroup.enabled"
                      message: "networkSecurityGroup.allowInbound requires networkSecurityGroup.enabled to be true."
                  properties:
                    name:
                      type: string
                      description: >-
                        Name of the virtual network in Azure. Defaults to the name of this resource.
                        Can't be changed after creation.
                      minLength: 2
                      maxLength: 64
                      pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9_]$"
                    location:
                      type: string
                      description: >-
                        Azure region. Optional; defaults to the platform default region. The platform may
                        restrict the allowed regions (EnvironmentValid=False, reason LocationNotAllowed).
                        Recorded in status.environment on first use and can't be changed afterwards.
                      pattern: "^[a-z][a-z0-9]*$"
                      maxLength: 40
                    resourceGroupName:
                      type: string
                      description: >-
                        Resource group for the virtual network. Optional; defaults to the platform default
                        resource group. Recorded in status.environment on first use and can't be changed
                        afterwards.
                      pattern: "^[a-zA-Z0-9._()-]*[a-zA-Z0-9_()-]$"
                      minLength: 1
                      maxLength: 90
                    size:
                      type: string
                      description: >-
                        Size of the address space allocated from the platform IPAM pool:
                        small is /25, medium is /24, large is /23. Can't be changed after creation.
                      enum: [small, medium, large]
                      default: medium
                    createSubnet:
                      type: boolean
                      description: Whether to create one subnet that uses the whole address space.
                      default: true
                    peerToHub:
                      type: boolean
                      description: >-
                        Whether to connect the virtual network to the platform's virtual hub. Needs the
                        platform to have a hub configured; otherwise the connection is not created and
                        the EnvironmentValid condition explains why.
                      default: true
                    networkSecurityGroup:
                      type: object
                      description: >-
                        Network security group on the subnet. Enabled by default and denies all inbound
                        traffic from outside the virtual network unless a rule in allowInbound allows it.
                        Has no effect when createSubnet is false.
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          description: Whether to create and attach the network security group. Disabling it is not recommended.
                          default: true
                        allowInbound:
                          type: array
                          description: Inbound traffic to allow. At most 10 rules. Each rule allows one port from specific sources.
                          maxItems: 10
                          items:
                            type: object
                            required: [name, port, sourceAddressPrefix]
                            properties:
                              name:
                                type: string
                                description: Rule name, unique in the list.
                                pattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
                                maxLength: 40
                              port:
                                type: integer
                                description: Destination port.
                                minimum: 1
                                maximum: 65535
                              protocol:
                                type: string
                                description: Network protocol.
                                enum: [Tcp, Udp]
                                default: Tcp
                              sourceAddressPrefix:
                                type: string
                                description: >-
                                  Source as a CIDR range, for example 10.0.0.0/8, or the service tag VirtualNetwork.
                                  The Internet, wildcard and 0.0.0.0/0 sources are not allowed.
                                maxLength: 43
                                x-kubernetes-validations:
                                  - rule: "self == 'VirtualNetwork' || (self.matches('^[0-9]{1,3}(\\\\.[0-9]{1,3}){3}/([0-9]|[12][0-9]|3[0-2])$') && self != '0.0.0.0/0')"
                                    message: "Use a CIDR range other than 0.0.0.0/0, or the service tag VirtualNetwork."
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [name]
                    tags:
                      type: object
                      description: >-
                        Tags added to the virtual network. Only costCenter, owner and environment are allowed
                        (at most 10 entries, values up to 256 characters). The platform adds the a5n- tags
                        itself; the a5n- prefix is reserved.
                      maxProperties: 10
                      additionalProperties:
                        type: string
                        maxLength: 256
                      x-kubernetes-validations:
                        - rule: "self.all(k, k in ['costCenter', 'owner', 'environment'])"
                          message: "Allowed tag keys: costCenter, owner, environment."
            status:
              type: object
              description: >-
                Observed state, written by the platform. The pinned values (subscription, subscriptionUid,
                subscriptionId and environment) are written once and can't be changed or removed afterwards,
                even by administrators; a tampered resource is recovered by deleting it. Conditions
                (Ready, Synced, SubscriptionResolved, EnvironmentValid, EnvironmentDrift) are managed by the
                platform and Crossplane and are not declared here. Tenants have no write access to status.
              x-kubernetes-validations:
                - rule: "!has(oldSelf.subscription) || (has(self.subscription) && self.subscription == oldSelf.subscription)"
                  message: "status.subscription is write-once."
                - rule: "!has(oldSelf.subscriptionUid) || (has(self.subscriptionUid) && self.subscriptionUid == oldSelf.subscriptionUid)"
                  message: "status.subscriptionUid is write-once."
                - rule: "!has(oldSelf.subscriptionId) || (has(self.subscriptionId) && self.subscriptionId == oldSelf.subscriptionId)"
                  message: "status.subscriptionId is write-once."
                - rule: "!has(oldSelf.environment) || (has(self.environment) && self.environment == oldSelf.environment)"
                  message: "status.environment is write-once."
              properties:
                subscription:
                  type: string
                  description: Name of the Subscription the resources are created in, recorded once and never re-resolved.
                subscriptionUid:
                  type: string
                  description: Kubernetes UID of that Subscription. Detects deleting and recreating a Subscription with the same name.
                subscriptionId:
                  type: string
                  description: Azure subscription ID (GUID) of that Subscription.
                environment:
                  type: object
                  description: >-
                    Effective environment values recorded when the virtual network was first composed.
                    Later changes to the EnvironmentConfig do not move existing resources.
                  properties:
                    location:
                      type: string
                      description: Azure region in use.
                    resourceGroupName:
                      type: string
                      description: Resource group in use.
                vnetName:
                  type: string
                  description: Name of the virtual network in Azure.
                resourceId:
                  type: string
                  description: Azure resource ID of the virtual network.
                addressSpace:
                  type: array
                  description: Address prefixes allocated from the IPAM pool.
                  items:
                    type: string
                subnetId:
                  type: string
                  description: >-
                    Azure resource ID of the subnet. Set once the subnet exists. A LandingZone reads it to
                    place its private endpoints.
                networkSecurityGroupId:
                  type: string
                  description: Azure resource ID of the network security group on the subnet. Set once it exists.
