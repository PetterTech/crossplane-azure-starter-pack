apiVersion: platform.a5n.io/v1alpha1
kind: VirtualNetwork
metadata:
  name: pettertech-spoke
  namespace: pettertech-sandbox
spec:
  # Optional when the namespace has exactly one Ready Subscription.
  subscription: pettertech-sandbox
  parameters:
    size: small
    networkSecurityGroup:
      allowInbound:
        - name: https-from-vnet
          port: 443
          sourceAddressPrefix: VirtualNetwork
    tags:
      costCenter: "0000"
      owner: platform-team@example.com
      environment: sandbox
---
# Minimal: medium address space from the IPAM pool, one subnet, a deny-inbound NSG and hub peering.
# subscription is optional when the namespace has exactly one Ready Subscription.
apiVersion: platform.a5n.io/v1alpha1
kind: VirtualNetwork
metadata:
  name: pettertech-minimal
  namespace: pettertech-sandbox
spec: {}
