# The same XR after the resolver pinned subscription and environment (reconcile 2 onwards).
apiVersion: platform.a5n.io/v1alpha1
kind: VirtualNetwork
metadata:
  name: spoke
  namespace: team-a
  uid: 7a1b2c3d-0000-4000-8000-000000000001
spec:
  parameters:
    size: small
    createSubnet: true
    peerToHub: true
    networkSecurityGroup:
      enabled: true
      allowInbound:
