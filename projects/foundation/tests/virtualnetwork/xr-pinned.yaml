  subscriptionUid: 4f0c1d2e-0000-4000-8000-00000000000a
  subscriptionId: eeeeeeee-1111-2222-3333-ffffffffffff
  environment:
    location: northeurope
    resourceGroupName: rg-pinned
    ipamPoolId: /subscriptions/cccccccc-1111-2222-3333-dddddddddddd/resourceGroups/rg-test/providers/Microsoft.Network/networkManagers/nm-test/ipamPools/pool-test
    hubVirtualHubId: /subscriptions/cccccccc-1111-2222-3333-dddddddddddd/resourceGroups/rg-test/providers/Microsoft.Network/virtualHubs/hub-test
