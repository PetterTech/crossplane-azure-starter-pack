apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: landingzones.platform.a5n.io
spec:
  scope: Namespaced
  group: platform.a5n.io
  names:
    kind: LandingZone
    plural: landingzones
    singular: landingzone
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: SUBSCRIPTION
          type: string
          jsonPath: .status.subscription
        - name: SUBSCRIPTION-ID
          type: string
          jsonPath: .status.subscriptionId
        - name: LOCATION
          type: string
          jsonPath: .status.environment.location
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A landing zone: a new Azure subscription for a workload, created by the platform, plus the
            building blocks you ask for in it: a virtual network, a storage account and a key vault.
            A landing zone with no fields creates only the subscription. Storage accounts and key
            vaults in a landing zone are always private: their private endpoints use the landing zone's
            own virtual network (the one it creates or the one named in spec.virtualNetwork). Billing
            scope, management group, tenant, hub, IPAM pool and default region come from the platform
            EnvironmentConfig, never from this spec. The landing zone also creates one resource group in
            its new subscription, named rg-<name> unless parameters.resourceGroupName is set; it is
            never deleted and never locked. Deleting a landing zone never
            cancels or deletes the subscription: it is left in Azure and must be cancelled by the platform
            team. Condition Ready=True means the subscription and every requested part exist.
          x-kubernetes-validations:
            - rule: "self.metadata.name != 'default'"
              message: "The name 'default' is reserved. Choose a descriptive name."
            - rule: "!self.metadata.name.startsWith('platform-')"
              message: "Names starting with 'platform-' are reserved for the platform team."
            - rule: "self.metadata.name.matches('^[a-z][a-z0-9-]*[a-z0-9]$')"
              message: "The name must start with a letter, then use lowercase letters, digits and '-', and end with a letter or digit."
            - rule: "size(self.metadata.name) <= 30"
              message: "The name must be at most 30 characters so that the derived Azure names stay short."
          properties:
            spec:
              type: object
              description: Desired landing zone. Every field is optional.
              default: {}
              x-kubernetes-validations:
                - rule: "!has(oldSelf.subscription) || (has(self.subscription) && self.subscription == oldSelf.subscription)"
                  message: "spec.subscription can't be changed once set. Create a new LandingZone instead."
                - rule: "!has(oldSelf.virtualNetwork) || (has(self.virtualNetwork) && self.virtualNetwork == oldSelf.virtualNetwork)"
                  message: "spec.virtualNetwork can't be changed once set. Create a new LandingZone instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.workload) || (has(self.parameters) && has(self.parameters.workload) && self.parameters.workload == oldSelf.parameters.workload)"
                  message: "spec.parameters.workload can't be changed once set. Create a new LandingZone instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.location) || (has(self.parameters) && has(self.parameters.location) && self.parameters.location == oldSelf.parameters.location)"
                  message: "spec.parameters.location can't be changed once set. Create a new LandingZone instead."
                - rule: "!has(oldSelf.parameters) || !has(oldSelf.parameters.resourceGroupName) || (has(self.parameters) && has(self.parameters.resourceGroupName) && self.parameters.resourceGroupName == oldSelf.parameters.resourceGroupName)"
                  message: "spec.parameters.resourceGroupName can't be changed once set. Create a new LandingZone instead."
                - rule: "!has(self.virtualNetwork) || !has(self.parameters) || !has(self.parameters.network)"
                  message: "Set either spec.virtualNetwork (use an existing virtual network) or spec.parameters.network (create one), not both."
                - rule: "!has(self.parameters) || (!has(self.parameters.storageAccount) && !has(self.parameters.keyVault)) || has(self.virtualNetwork) || has(self.parameters.network)"
                  message: "storageAccount and keyVault are private and need a virtual network: set spec.parameters.network (create one) or spec.virtualNetwork (use an existing one)."
                - rule: "!has(self.deletionPolicy) || self.deletionPolicy != 'Delete' || (has(self.parameters) && has(self.parameters.workload) && self.parameters.workload == 'DevTest')"
                  message: "deletionPolicy Delete is only allowed with parameters.workload DevTest. Production landing zones are Orphan only."
              properties:
                subscription:
                  type: string
                  description: >-
                    Name of the Subscription this landing zone creates. Optional; defaults to the name of
                    the landing zone. It must follow the Subscription naming rules (at most 30 characters,
                    no 'default', no 'platform-' prefix) and not already exist. The name is recorded in
                    status.subscription and never changes afterwards. It can't be changed once set; to
                    move, create a new landing zone.
                  maxLength: 30
                  pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
                  x-kubernetes-validations:
                    - rule: "self != 'default' && !self.startsWith('platform-')"
                      message: "The name 'default' and the 'platform-' prefix are reserved."
                virtualNetwork:
                  type: string
                  description: >-
                    Name of an existing VirtualNetwork in this namespace whose subnet the private endpoints
                    of the landing zone's storage account and key vault use. Optional. That virtual network
                    must belong to this landing zone's subscription (its spec.subscription must equal the
                    landing zone's subscription; otherwise it is refused) and have a subnet; until its subnet exists
                    nothing that needs it is created and the condition VirtualNetworkResolved explains why.
                    The subnet is recorded in status.network and never changes afterwards. Use
                    spec.parameters.network instead to let the landing zone create its own virtual network;
                    the two are mutually exclusive. Can't be changed once set.
                  maxLength: 63
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                deletionPolicy:
                  type: string
                  description: >-
                    What happens in Azure to the storage account and key vault of the landing zone when this
                    resource is deleted. Orphan (default): they stay in Azure with all their data, and only
                    the Kubernetes objects are removed. Delete: they are deleted in Azure (a key vault stays
                    soft-deleted with purge protection). Delete is allowed only with parameters.workload
                    DevTest. It never applies to the subscription or the resource group: neither is ever
                    cancelled or deleted when a landing zone is deleted, whatever this field says. A new landing zone with the same name adopts the orphaned resources.
                  enum: [Delete, Orphan]
                  default: Orphan
                parameters:
                  type: object
                  description: Settings of the landing zone.
                  default: {}
                  properties:
                    workload:
                      type: string
                      description: >-
                        Azure workload type of the subscription. Production is the safe default; use DevTest
                        only for non-production work. Can't be changed after creation.
                      enum: [Production, DevTest]
                      default: Production
                    location:
                      type: string
                      description: >-
                        Azure region of the resources in the landing zone. Optional; defaults to the platform
                        default region. The platform may restrict the allowed regions (EnvironmentValid=False,
                        reason LocationNotAllowed). Recorded in status.environment on first use and can't be
                        changed afterwards.
                      pattern: "^[a-z][a-z0-9]*$"
                      maxLength: 40
                    resourceGroupName:
                      type: string
                      description: >-
                        Name of the resource group the landing zone creates in its new subscription for its
                        resources. Optional; defaults to rg-<name>, where <name> is the name of the landing
                        zone. The platform's default resource group is not used. The group is never deleted
                        and never locked. Recorded in status.environment on first use and can't be changed
                        afterwards.
                      pattern: "^[a-zA-Z0-9._()-]*[a-zA-Z0-9_()-]$"
                      minLength: 1
                      maxLength: 90
                    network:
                      type: object
                      description: >-
                        Create a virtual network (and its subnet) in the landing zone. Leave it out for no
                        virtual network. The private endpoints of storageAccount and keyVault use its subnet.
                        The virtual network is a VirtualNetwork resource in this namespace named after the
                        landing zone.
                      properties:
                        size:
                          type: string
                          description: >-
                            Size of the address space allocated from the platform IPAM pool: small is /25,
                            medium is /24, large is /23.
                          enum: [small, medium, large]
                          default: medium
                        peerToHub:
                          type: boolean
                          description: >-
                            Whether to connect the virtual network to the platform's virtual hub. Needs the
                            platform to have a hub configured.
                          default: true
                    storageAccount:
                      type: object
                      description: >-
                        Create a private storage account in the landing zone. Leave it out for none. The
                        account has the same hardened settings as the StorageAccount API. It is a
                        StorageAccount resource in this namespace named after the landing zone.
                      properties:
                        replication:
                          type: string
                          description: Replication of the storage account.
                          enum: [LRS, ZRS, GRS, GZRS]
                          default: ZRS
                        containers:
                          type: array
                          description: Blob containers to create, all private. At most 20.
                          maxItems: 20
                          items:
                            type: object
                            required: [name]
                            properties:
                              name:
                                type: string
                                description: Container name, unique in the list.
                                minLength: 3
                                maxLength: 63
                                pattern: "^[a-z0-9]([a-z0-9]|-[a-z0-9])*$"
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [name]
                    keyVault:
                      type: object
                      description: >-
                        Create a private key vault in the landing zone. Leave it out for none. The vault has
                        the same hardened settings as the KeyVault API (RBAC, purge protection). It is a
                        KeyVault resource in this namespace named after the landing zone.
                      properties:
                        softDeleteDays:
                          type: integer
                          description: Days a deleted vault and its objects can be recovered. Can't be changed once created.
                          minimum: 7
                          maximum: 90
                          default: 90
                    tags:
                      type: object
                      description: >-
                        Tags added to the subscription and every resource in the landing zone. Only
                        costCenter, owner and environment are allowed (at most 10 entries, values up to
                        256 characters). The platform adds the a5n- tags itself; the a5n- prefix is reserved.
                      maxProperties: 10
                      additionalProperties:
                        type: string
                        maxLength: 256
                      x-kubernetes-validations:
                        - rule: "self.all(k, k in ['costCenter', 'owner', 'environment'])"
                          message: "Allowed tag keys: costCenter, owner, environment."
            status:
              type: object
              description: >-
                Observed state, written by the platform. The pinned values (subscription, subscriptionUid,
                subscriptionId, environment and network) are written once and can't be changed or removed
                afterwards, even by administrators; a tampered resource is recovered by deleting it.
                Conditions (Ready, Synced, SubscriptionResolved, VirtualNetworkResolved, EnvironmentValid,
                EnvironmentDrift) are managed by the platform and Crossplane and are not declared here.
                Tenants have no write access to status.
              x-kubernetes-validations:
                - rule: "!has(oldSelf.subscription) || (has(self.subscription) && self.subscription == oldSelf.subscription)"
                  message: "status.subscription is write-once."
                - rule: "!has(oldSelf.subscriptionUid) || (has(self.subscriptionUid) && self.subscriptionUid == oldSelf.subscriptionUid)"
                  message: "status.subscriptionUid is write-once."
                - rule: "!has(oldSelf.subscriptionId) || (has(self.subscriptionId) && self.subscriptionId == oldSelf.subscriptionId)"
                  message: "status.subscriptionId is write-once."
                - rule: "!has(oldSelf.environment) || (has(self.environment) && self.environment == oldSelf.environment)"
                  message: "status.environment is write-once."
                - rule: "!has(oldSelf.network) || (has(self.network) && self.network == oldSelf.network)"
                  message: "status.network is write-once."
              properties:
                subscription:
                  type: string
                  description: Name of the Subscription this landing zone created, recorded once and never re-resolved.
                subscriptionUid:
                  type: string
                  description: Kubernetes UID of that Subscription. Detects deleting and recreating a Subscription with the same name.
                subscriptionId:
                  type: string
                  description: Azure subscription ID (GUID) of that Subscription.
                providerConfigName:
                  type: string
                  description: Name of the namespaced ProviderConfig that acts in the landing zone's subscription.
                environment:
                  type: object
                  description: >-
                    Effective environment values recorded once, as a whole, when the landing zone was first
                    composed. Later changes to the EnvironmentConfig do not move existing resources; the
                    EnvironmentDrift condition reports the difference.
                  properties:
                    location:
                      type: string
                      description: Azure region in use.
                    resourceGroupName:
                      type: string
                      description: >-
                        Resource group in use: the one composed in the landing zone's subscription
                        (rg-<name> unless parameters.resourceGroupName is set). It is never deleted or locked.
                network:
                  type: object
                  description: >-
                    The virtual network and subnet the private endpoints use, recorded once when the subnet
                    first resolved.
                  properties:
                    virtualNetwork:
                      type: string
                      description: Name of the VirtualNetwork resource (created by the landing zone or named in spec.virtualNetwork).
                    subnetId:
                      type: string
                      description: Azure resource ID of the subnet used for private endpoints.
                storageAccountName:
                  type: string
                  description: Name of the storage account in Azure. Set when parameters.storageAccount is used.
                blobEndpoint:
                  type: string
                  description: Blob service endpoint URL of the storage account; resolves privately inside the virtual network.
                keyVaultName:
                  type: string
                  description: Name of the key vault in Azure. Set when parameters.keyVault is used.
                keyVaultUri:
                  type: string
                  description: URI of the key vault; resolves privately inside the virtual network.
