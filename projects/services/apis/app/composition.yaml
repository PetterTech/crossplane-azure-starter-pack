apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: apps.azure.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef: {name: function-environment-configs}
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: azure
    # P&T cannot look up other XRs or omit the public App's private endpoint.
    - step: network
      functionRef: {name: function-go-templating}
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" | default dict }}
            {{- if empty $env.defaultLocation }}{{ fail "EnvironmentConfig azure must provide defaultLocation" }}{{ end }}
            {{- $required := .requiredResources | default dict }}
            {{- $network := dig "network" "items" (list) $required | first | default dict }}
            {{- $space := dig "space" "items" (list) $required | first | default dict }}
            {{- $spaceName := dig "resource" "spec" "space" "" $network }}
            {{- if and (hasKey $required "network") (empty $network) }}
            {{- fail (printf "Network %s not found in namespace %s" $xr.spec.network $xr.metadata.namespace) }}
            {{- end }}
            {{- if and (hasKey $required "network") (empty $spaceName) }}
            {{- fail (printf "Network %s must select a Space" $xr.spec.network) }}
            {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              network:
                apiVersion: platform.example.org/v1alpha1
                kind: Network
                namespace: {{ $xr.metadata.namespace | quote }}
                matchName: {{ $xr.spec.network | quote }}
              {{- if $spaceName }}
              space:
                apiVersion: platform.example.org/v1alpha1
                kind: Space
                namespace: {{ $xr.metadata.namespace | quote }}
                matchName: {{ $spaceName | quote }}
              {{- end }}
            {{- $subnetID := dig "resource" "status" "subnetID" "" $network }}
            {{- $providerConfigName := dig "resource" "status" "providerConfigName" "" $space }}
            {{- $subscriptionID := dig "resource" "status" "subscriptionID" "" $space }}
            {{- if hasKey $required "space" }}
            {{- if empty $space }}{{ fail (printf "Space %s not found in namespace %s" $spaceName $xr.metadata.namespace) }}{{ end }}
            {{- if or (empty $providerConfigName) (empty $subscriptionID) (and (eq $xr.spec.exposure "private") (empty $subnetID)) }}
            {{- fail (printf "waiting for Network %s and Space %s to publish status" $xr.spec.network $spaceName) }}
            {{- end }}
            {{- $_ := set $env "providerConfigName" $providerConfigName }}
            {{- $_ := set $env "resourceGroupName" (printf "app-%s" $xr.metadata.name) }}
            {{- $hash := sha256sum (printf "%s/%s/%s" $subscriptionID $xr.metadata.namespace $xr.metadata.name) }}
            {{- $appName := printf "ca%s" (trunc 22 $hash) }}
            {{- $_ := set $env "appName" $appName }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: Context
            data:
              apiextensions.crossplane.io/environment: {{ $env | toJson }}
            {{- if eq $xr.spec.exposure "private" }}
            {{- $environment := getComposedResource . "environment" | default dict }}
            {{- $endpoint := getComposedResource . "private-endpoint" | default dict }}
            {{- $environmentID := dig "status" "atProvider" "id" "" $environment }}
            {{- if and (not (empty $endpoint)) (empty $environmentID) }}
            {{- fail "waiting for App environment to publish its resource ID; keeping the private endpoint" }}
            {{- end }}
            {{- if $environmentID }}
            ---
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: PrivateEndpoint
            metadata:
              annotations:
                {{ setResourceNameAnnotation "private-endpoint" }}
                crossplane.io/external-name: {{ printf "%s-env-pe" $appName | quote }}
            spec:
              providerConfigRef: {kind: ProviderConfig, name: {{ $providerConfigName | quote }}}
              forProvider:
                location: {{ $env.defaultLocation | quote }}
                resourceGroupName: {{ $env.resourceGroupName | quote }}
                subnetId: {{ $subnetID | quote }}
                privateServiceConnection:
                  name: app
                  isManualConnection: false
                  privateConnectionResourceId: {{ $environmentID | quote }}
                  subresourceNames: [managedEnvironment]
                tags: {{ mergeOverwrite (deepCopy ($xr.spec.tags | default dict)) ($env.platformTags | default dict) | toJson }}
            {{- end }}
            {{- $endpointID := dig "status" "atProvider" "id" "" $endpoint }}
            {{- $endpointIPAddress := dig "status" "atProvider" "privateServiceConnection" "privateIpAddress" "" $endpoint }}
            {{- if or $endpointID $endpointIPAddress }}
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: App
            status:
              {{- with $endpointID }}
              privateEndpointID: {{ . | quote }}
              {{- end }}
              {{- with $endpointIPAddress }}
              privateEndpointIPAddress: {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
    - step: compose
      functionRef: {name: function-patch-and-transform}
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: provider
            patches: [{type: FromEnvironmentFieldPath, fromFieldPath: providerConfigName, toFieldPath: spec.providerConfigRef.name, policy: {fromFieldPath: Required}}]
          - name: location
            patches: [{type: FromEnvironmentFieldPath, fromFieldPath: defaultLocation, toFieldPath: spec.forProvider.location, policy: {fromFieldPath: Required}}]
          - name: group
            patches: [{type: FromEnvironmentFieldPath, fromFieldPath: resourceGroupName, toFieldPath: spec.forProvider.resourceGroupName, policy: {fromFieldPath: Required}}]
          - name: tags
            patches:
              - {type: FromEnvironmentFieldPath, fromFieldPath: platformTags, toFieldPath: spec.forProvider.tags}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.tags, toFieldPath: spec.forProvider.tags, policy: {toFieldPath: MergeObjects}}
        resources:
          - name: network-usage
            base:
              apiVersion: protection.crossplane.io/v1beta1
              kind: Usage
              spec:
                replayDeletion: true
                of: {apiVersion: platform.example.org/v1alpha1, kind: Network, resourceRef: {}}
                reason: An App uses this Network.
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.network, toFieldPath: spec.of.resourceRef.name}
            readinessChecks:
              - type: None
          - name: resource-group
            base:
              apiVersion: azure.m.upbound.io/v1beta1
              kind: ResourceGroup
              spec:
                providerConfigRef: {kind: ProviderConfig}
            patches:
              - {type: PatchSet, patchSetName: provider}
              - {type: PatchSet, patchSetName: location}
              - {type: PatchSet, patchSetName: tags}
              - {type: FromEnvironmentFieldPath, fromFieldPath: resourceGroupName, toFieldPath: "metadata.annotations[crossplane.io/external-name]", policy: {fromFieldPath: Required}}
          - name: environment
            base:
              apiVersion: containerapp.azure.m.upbound.io/v1beta1
              kind: Environment
              spec:
                providerConfigRef: {kind: ProviderConfig}
                forProvider:
                  workloadProfile: [{name: Consumption, workloadProfileType: Consumption}]
            patches:
              - {type: PatchSet, patchSetName: provider}
              - {type: PatchSet, patchSetName: location}
              - {type: PatchSet, patchSetName: group}
              - {type: PatchSet, patchSetName: tags}
              - {type: FromEnvironmentFieldPath, fromFieldPath: appName, toFieldPath: "metadata.annotations[crossplane.io/external-name]", policy: {fromFieldPath: Required}, transforms: [{type: string, string: {type: Format, fmt: "%s-env"}}]}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.exposure
                toFieldPath: spec.forProvider.publicNetworkAccess
                transforms: [{type: map, map: {private: Disabled, public: Enabled}}]
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.id, toFieldPath: status.environmentID}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.defaultDomain, toFieldPath: status.environmentDefaultDomain}
            readinessChecks:
              - {type: MatchCondition, matchCondition: {type: Ready, status: "True"}}
              - {type: NonEmpty, fieldPath: status.atProvider.id}
              - {type: NonEmpty, fieldPath: status.atProvider.defaultDomain}
          - name: app
            base:
              apiVersion: containerapp.azure.m.upbound.io/v1beta1
              kind: ContainerApp
              spec:
                providerConfigRef: {kind: ProviderConfig}
                forProvider:
                  containerAppEnvironmentIdSelector: {matchControllerRef: true}
                  workloadProfileName: Consumption
                  revisionMode: Single
                  identity: {type: SystemAssigned}
                  # External means outside the environment, not necessarily the internet.
                  ingress:
                    externalEnabled: true
                    allowInsecureConnections: false
                    transport: auto
                    trafficWeight: [{latestRevision: true, percentage: 100}]
                  template:
                    minReplicas: 1
                    maxReplicas: 3
                    httpScaleRule: [{name: http, concurrentRequests: "50"}]
                    container: [{name: app, cpu: 0.25, memory: 0.5Gi}]
            patches:
              - {type: PatchSet, patchSetName: provider}
              - {type: PatchSet, patchSetName: group}
              - {type: PatchSet, patchSetName: tags}
              - {type: FromEnvironmentFieldPath, fromFieldPath: appName, toFieldPath: "metadata.annotations[crossplane.io/external-name]", policy: {fromFieldPath: Required}}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.image, toFieldPath: "spec.forProvider.template.container[0].image"}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.targetPort, toFieldPath: spec.forProvider.ingress.targetPort}
              - {type: ToCompositeFieldPath, fromFieldPath: "metadata.annotations[crossplane.io/external-name]", toFieldPath: status.appName}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.id, toFieldPath: status.resourceID}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.ingress.fqdn, toFieldPath: status.fqdn}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.ingress.fqdn, toFieldPath: status.url, transforms: [{type: string, string: {type: Format, fmt: "https://%s"}}]}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.identity.principalId, toFieldPath: status.principalID}
            readinessChecks:
              - {type: MatchCondition, matchCondition: {type: Ready, status: "True"}}
              - {type: NonEmpty, fieldPath: status.atProvider.id}
              - {type: NonEmpty, fieldPath: status.atProvider.ingress.fqdn}
              - {type: NonEmpty, fieldPath: status.atProvider.identity.principalId}
    - step: sequence
      functionRef: {name: function-sequencer}
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        enableDeletionSequencing: true
        usageVersion: v2
        replayDeletion: true
        resetCompositeReadiness: true
        rules:
          - sequence: [network-usage, resource-group, environment, app]
          - sequence: [environment, private-endpoint]
    - step: auto-ready
      functionRef: {name: function-auto-ready}
