apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: secretstores.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: SecretStore
    plural: secretstores
  defaultCompositionRef:
    name: secretstores.azure.platform.example.org
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Vault
          type: string
          jsonPath: .status.vaultName
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          description: >-
            A private Key Vault in a Network's Space, with its own resource group
            and private endpoint in the Network subnet. Access is Azure RBAC
            only; this API does not grant data access or manage secret values.
            Private DNS is left to Azure Policy. Deleting a SecretStore deletes
            its infrastructure. Purge protection keeps the deleted vault and
            its contents recoverable, and its name reserved, for 90 days.
            Recovery does not restore Azure RBAC assignments.
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 63
              message: SecretStore name must be at most 63 characters.
          properties:
            spec:
              type: object
              required: [network]
              properties:
                network:
                  type: string
                  description: >-
                    Name of a Network in this namespace. The SecretStore uses
                    the Network's Space and subnet. Immutable.
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Network cannot change; create a new SecretStore.
                tags:
                  type: object
                  description: Up to 40 user tags. Platform-owned tags take precedence.
                  default: {}
                  maxProperties: 40
                  additionalProperties:
                    type: string
                    maxLength: 256
                  x-kubernetes-validations:
                    - rule: "self.all(k, size(k) > 0 && size(k) <= 512 && !k.matches('[<>%&\\\\\\\\?/]+'))"
                      message: Tag keys must be 1-512 characters and cannot contain < > % & \ ? /.
            status:
              type: object
              properties:
                vaultName:
                  type: string
                  description: Globally unique Key Vault name.
                resourceID:
                  type: string
                  description: Key Vault Azure resource ID; scope data-access grants here.
                vaultURI:
                  type: string
                  description: Vault URI; requires private DNS and network access.
                privateEndpointID:
                  type: string
                  description: Private endpoint Azure resource ID.
