# Parameters are written out in full: crossplane render does not apply XRD defaults to the input XR.
apiVersion: platform.a5n.io/v1alpha1
kind: KeyVault
metadata:
  name: secrets
  namespace: team-a
  uid: 7a1b2c3d-0000-4000-8000-000000000003
spec:
  deletionPolicy: Orphan
  parameters:
    networking: private
    softDeleteDays: 90
    tags:
      costCenter: "0000"
      owner: platform-team@example.com
      environment: sandbox
