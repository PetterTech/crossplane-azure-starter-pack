apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata: {name: svc-vnet}
spec:
  compositeTypeRef: {apiVersion: spike.a5n.io/v1alpha1, kind: Svc}
  mode: Pipeline
  pipeline:
  - step: kro
    functionRef: {name: function-kro}
    input:
      apiVersion: kro.fn.crossplane.io/v1alpha1
      kind: ResourceGraph
      status:
        subnet: ${"/subscriptions/0/subnets/" + schema.metadata.name}
      resources:
      - id: main
        readyWhen:
        - ${schema.spec.networking == "public"}
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata: {}
          data: {k: v}
  - step: auto-ready
    functionRef: {name: function-auto-ready}
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata: {name: svc-lz}
spec:
  compositeTypeRef: {apiVersion: spike.a5n.io/v1alpha1, kind: Svc}
  mode: Pipeline
  pipeline:
  - step: lookup
    functionRef: {name: function-go-templating}
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $vn := get $xr.spec "virtualNetwork" | default "" -}}
          {{- $er := .extraResources | default dict -}}
          {{- $items := list -}}
          {{- if hasKey $er "vnet" }}{{ $items = (get $er "vnet").items | default list }}{{ end -}}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            vnet:
              apiVersion: spike.a5n.io/v1alpha1
              kind: Svc
              namespace: {{ $xr.metadata.namespace }}
              matchName: {{ $vn | default "none" | quote }}
          {{- if hasKey $er "vnet" }}
          ---
          apiVersion: spike.a5n.io/v1alpha1
          kind: Svc
          {{- if eq (len $items) 0 }}
          status:
            fromStatus: "NOTFOUND"
          {{- else }}
          {{- $v := (index $items 0).resource }}
          {{- $ready := false }}
          {{- range $c := (get ($v.status | default dict) "conditions" | default list) }}{{ if and (eq $c.type "Ready") (eq $c.status "True") }}{{ $ready = true }}{{ end }}{{ end }}
          status:
            fromStatus: {{ printf "found ready=%v subnet=%s" $ready (get ($v.status | default dict) "subnet" | default "") | quote }}
          {{- end }}
          {{- end }}
  - step: auto-ready
    functionRef: {name: function-auto-ready}
